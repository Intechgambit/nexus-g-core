cloud:
  provider: gcp
  bucket_path: gs://my-bucket/genomics
  credentials:
    credentials_path: /path/to/service-account.json
    project_id: my-project

blast:
  db_path: /data/blastdb/nt
  program: blastn
  evalue: 1.0e-5
  word_size: 16
  num_threads: 4
  extra_args:
    - -max_target_seqs
    - "10"

run:
  pool_workers: 4
  jobs:
    - input: queries/sample1.fasta
      output: results/sample1_blast.tsv
    - input: queries/sample2.fasta
      output: results/sample2_blast.tsv
